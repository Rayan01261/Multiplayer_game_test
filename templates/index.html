<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<meta charset="UTF-8">
<title>Canvas em branco</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  canvas {
    background: #ffffff;
    border: 2px solid #444;
  }
</style>
</head>
<body>

<canvas id="canvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const SIZE = 40;
const SPEED = 4;

// Quadrado controlado por WASD
const player = {
  x: null,
  y: null,
  size: SIZE,
  color: "#3498db"
};

// Segundo quadrado (movimento ainda não definido)
const other = {
  x: null,
  y: null,
  size: SIZE,
  color: "#e74c3c"
};

// Estado das teclas pressionadas
const keys = {
  w: false,
  a: false,
  s: false,
  d: false
};

window.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = true;
});

window.addEventListener("keyup", (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = false;
});

function updatePlayer() {
  if (keys.w) socket.emit('move_up', {'speed':SPEED});
  if (keys.s) socket.emit('move_down', {'speed':SPEED});
  if (keys.a) socket.emit('move_left', {'speed':SPEED});
  if (keys.d) socket.emit('move_right', {'speed':SPEED});


  // Limita o quadrado às bordas do canvas
  player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

}

function updateOther() {
  // TODO: definir como este quadrado se move
}

function draw_rect() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.size, player.size);

  ctx.fillStyle = other.color;
  ctx.fillRect(other.x, other.y, other.size, other.size);
}

function loop() {
  updatePlayer();
  updateOther();
  draw_rect();
  requestAnimationFrame(loop);
}

//listners de socket

const socket = io();

socket.on('connect', () => {
  meuSid = socket.id
})
loop();

socket.on('update_player_pos', (data) => {
  const jogador = data.jogador;

  if (jogador.plr == 0) {
    player.x = jogador.pos_x;
    player.y = jogador.pos_y;
  } else if (jogador.plr == 1) {
    other.x = jogador.pos_x;
    other.y = jogador.pos_y;
  }
});
</script>

</body>
</html>
