<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<meta charset="UTF-8">
<title>Canvas em branco</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  canvas {
    background: #ffffff;
    border: 2px solid #444;
  }
</style>
</head>
<body>

<canvas id="canvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const SIZE = 40;
const SPEED = 4;
const BULLET_SPEED = 80;

// Quadrado controlado por WASD
let players = {
  
};

let mapa = {
  
}

// Segundo quadrado (movimento ainda não definido)
let meuSid;
//Pare agora
let mouse = {
  x : 0,
  y : 0
}

let pick_up_obj = {
  x: null,
  y: null,
  size: 10,
  color: "#ff69b4"
}

let bullets = {


}

// Estado das teclas pressionadas
const keys = {
  w: false,
  a: false,
  s: false,
  d: false
};

window.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = true;
});

window.addEventListener("keyup", (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = false;
});

window.addEventListener('mousemove', (e) => {
    rect = canvas.getBoundingClientRect()
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
})

window.addEventListener('click' , (e) => {

  velocidades_angulo = anguloEntreArmaEMouse(mouse.x,mouse.y,players[meuSid].pos_x,players[meuSid].pos_y)
  velocidades = anguloDaBala(velocidades_angulo)
  socket.emit('attack', {"vel_x":velocidades.vel_x,"vel_y":velocidades.vel_y,"pos_x":players[meuSid].pos_x,"pos_y":players[meuSid].pos_y,'angulo':velocidades_angulo})
})


function anguloEntreArmaEMouse(mouse_x,mouse_y,arma_x,arma_y){
  return Math.atan2(mouse_y-arma_y, mouse_x-arma_x)
}

function updatePlayer() {
  if (keys.w) socket.emit('move_up', {'speed':SPEED});
  if (keys.s) socket.emit('move_down', {'speed':SPEED});
  if (keys.a) socket.emit('move_left', {'speed':SPEED});
  if (keys.d) socket.emit('move_right', {'speed':SPEED});



}

function anguloDaBala(angulo){
  vel_x = Math.cos(angulo) * 13
  vel_y = Math.sin(angulo) * 13
  return {vel_x, vel_y}
}


function draw_rect() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const [sid, jogador] of Object.entries(players)) {
    if(jogador.alive){
      ctx.fillStyle = jogador.color;
      ctx.fillRect(jogador.pos_x, jogador.pos_y, jogador.size, jogador.size);
    }

  }

}

function draw_map_tile(){
  for (const [id, tile] of Object.entries(mapa)) {
    ctx.fillStyle = "#000000";
    ctx.fillRect(tile.pos_x,tile.pos_y,40,40);
  }
}

function draw_pickup_obj(){
  if(pick_up_obj.x != null){
    ctx.fillStyle = pick_up_obj.color;
    ctx.fillRect(pick_up_obj.x, pick_up_obj.y, pick_up_obj.size, pick_up_obj.size);
  }
  
}

function render_weapon(){
  for (const [sid, jogador] of Object.entries(players)) {
    if(jogador.pickup == 1){
      ctx.fillStyle = '#000000';
      ctx.save()
      ctx.translate(jogador.pos_x+jogador.size/2, jogador.pos_y+jogador.size/2)
      ctx.rotate(anguloEntreArmaEMouse(jogador.mouse_x,jogador.mouse_y,jogador.pos_x+jogador.size/2, jogador.pos_y+jogador.size/2))
      ctx.fillRect(0, -30/2, 30, 10)
      ctx.restore()
    }

  }

}
function render_bullet(){
  for (const [id, bullet] of Object.entries(bullets)) {
    if(bullet.alive){
      ctx.fillStyle = '#FF0000';
      ctx.save()
      ctx.translate(bullet.pos_x, bullet.pos_y)
      ctx.rotate(bullet.angulo)
      ctx.fillRect(0, -5, 10, 10)
      ctx.restore()
    }

  }

}

function send_mouse(){
  socket.emit('send_mouse',{'mouse_x':mouse.x,'mouse_y':mouse.y})
}

function loop() {
  updatePlayer();
  draw_rect();
  draw_pickup_obj();
  render_weapon();
  render_bullet();
  send_mouse();
  draw_map_tile()
  requestAnimationFrame(loop);
  
}

//listners de socket

const socket = io();

socket.on('connect', () => {
  meuSid = socket.id
})
loop();

socket.on('update_player_pos', (data) => {
  players = data.jogadores;

});

socket.on('spawn_pickup', (data) => {
  const pickup = data
  pick_up_obj.x = pickup.pos_x
  pick_up_obj.y = pickup.pos_y
})

socket.on('pickup_dispawn', (data) => {
  pick_up_obj = data.pickup
  console.log('Objeto dispawnou')
})

socket.on('spawn_bullets', (data) => {
  bullets = data.bullets
})

socket.on('recebe_mapa', (data) => {
  mapa = data.paredes
})


</script>

</body>
</html>
