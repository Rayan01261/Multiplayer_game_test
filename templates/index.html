<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<meta charset="UTF-8">
<title>Canvas em branco</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  canvas {
    background: #ffffff;
    border: 2px solid #444;
  }
</style>
</head>
<body>

<canvas id="canvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const SIZE = 40;
const SPEED = 4;

// Quadrado controlado por WASD
let players = {
  
};

// Segundo quadrado (movimento ainda não definido)

//Pare agora


let pick_up_obj = {
  x: null,
  y: null,
  size: 10,
  color: "#ff69b4"
}

// Estado das teclas pressionadas
const keys = {
  w: false,
  a: false,
  s: false,
  d: false
};

window.addEventListener("keydown", (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = true;
});

window.addEventListener("keyup", (e) => {
  const key = e.key.toLowerCase();
  if (key in keys) keys[key] = false;
});

function updatePlayer() {
  if (keys.w) socket.emit('move_up', {'speed':SPEED});
  if (keys.s) socket.emit('move_down', {'speed':SPEED});
  if (keys.a) socket.emit('move_left', {'speed':SPEED});
  if (keys.d) socket.emit('move_right', {'speed':SPEED});



}

function draw_rect() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const [sid, jogador] of Object.entries(players)) {
    if(jogador.alive){
      ctx.fillStyle = jogador.color;
      ctx.fillRect(jogador.pos_x, jogador.pos_y, jogador.size, jogador.size);
    }
    console.log(jogador.x,jogador.y)
  }

}

function draw_pickup_obj(){
  if(pick_up_obj.x != null){
    ctx.fillStyle = pick_up_obj.color;
    ctx.fillRect(pick_up_obj.x, pick_up_obj.y, pick_up_obj.size, pick_up_obj.size);
  }
  
}



function loop() {
  updatePlayer();
  draw_rect();
  draw_pickup_obj();
  requestAnimationFrame(loop);
}

//listners de socket

const socket = io();

socket.on('connect', () => {
  meuSid = socket.id
})
loop();

socket.on('update_player_pos', (data) => {
  players = data.jogadores;

});

socket.on('spawn_pickup', (data) => {
  const pickup = data
  pick_up_obj.x = pickup.pos_x
  pick_up_obj.y = pickup.pos_y
})

socket.on('pickup_dispawn', (data) => {
  pick_up_obj = data.pickup
  console.log('Objeto dispawnou')
})
</script>

</body>
</html>
